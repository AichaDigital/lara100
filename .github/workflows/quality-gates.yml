name: Quality Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality-validation:
    name: Quality Validation (Format, PHPStan, Coverage, Mutation)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: 8.4
          extensions: bcmath, mbstring
          coverage: xdebug

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: 🎨 Check Code Format (Pint)
        run: composer format-check

      - name: 🔍 Static Analysis (PHPStan MAX)
        run: composer phpstan

      - name: 🧪 Run Tests
        run: composer test

      - name: 📊 Code Coverage (100%)
        run: composer test-coverage

      - name: 📤 Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./build/logs/clover.xml
          fail_ci_if_error: false

      - name: 🧬 Mutation Testing (70%+)
        run: composer test-mutate

      - name: ✅ All Quality Gates Passed
        if: success()
        run: echo "✅ All quality gates passed! Ready to merge."

      - name: ❌ Quality Gates Failed
        if: failure()
        run: |
          echo "❌ Quality gates failed. Please fix before merging:"
          echo "- Check code format with: composer format"
          echo "- Check PHPStan errors with: composer phpstan"
          echo "- Check failing tests with: composer test"
          echo "- Check coverage with: composer test-coverage"
          echo "- Check mutation score with: composer test-mutate"
          exit 1

